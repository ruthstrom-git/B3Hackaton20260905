databases:
  - name: b3-hackaton-demo-db
    plan: free

services:
  - type: web
    name: b3-hackaton-demo
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: b3-hackaton-demo-db
          property: connectionString
